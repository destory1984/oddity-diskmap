[package]
name = "oddity-diskmap"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
